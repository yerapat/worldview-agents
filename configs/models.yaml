# Model aliases used in grid configs. Each alias maps to a LiteLLM model string.
# `local: true` routes through the OpenAI-compatible endpoint in LOCAL_LLM_BASE_URL.
# Any id not listed here is passed to LiteLLM unchanged.

claude-haiku:
  litellm: anthropic/claude-haiku-4-5-20251001
claude-sonnet:
  litellm: anthropic/claude-sonnet-5-5
gpt-mini:
  litellm: openai/gpt-4o-mini
grok:
  litellm: xai/grok-3-mini
local-qwen:
  litellm: openai/qwen2.5:3b-instruct
  local: true
local-llama:
  litellm: openai/llama3:latest
  local: true
