[project]
name = "worldview-agents"
version = "0.1.0"
description = "Harness for testing how foundational-text worldviews change LLM agent behavior across model vendors."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
wva = "worldview_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldview_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
